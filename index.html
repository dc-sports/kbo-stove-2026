<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2026-27 KBO 스토브리그</title>
<style>
:root{--bg:#fff;--fg:#1d2130;--sub:#6b7187;--line:#e6e8ef;--soft:#f5f6fa;--card:#fff;--navy:#1f2a6b;--navy2:#3646a3;--gold:#f2b632;--new:#d9483b;--in:#1d7a4a;--inbg:#e6f6ee;--out:#b4372c;--outbg:#fdecea;--stay:#2a4fb8;--staybg:#e8f0ff;--tr:#8a5a00;--trbg:#fff3d6;--fr:#6a3fb5;--frbg:#f1eafd}
[data-theme=dark]{--bg:#14161d;--fg:#e8eaf2;--sub:#9aa1b8;--line:#2a2e3a;--soft:#1c1f28;--card:#1a1d25;--navy:#8fa0ff;--navy2:#8fa0ff;--in:#9be0b8;--inbg:#1f3a2c;--out:#f3a39a;--outbg:#3d2321;--stay:#bcd0ff;--staybg:#24305a;--tr:#f2cf7a;--trbg:#3a3120;--fr:#cdb6ff;--frbg:#2e2643}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:18px 18px 6px}
.logo{font-weight:900;font-style:italic;font-size:21px;color:var(--navy);letter-spacing:-.5px}
header h1{font-size:17px;font-weight:800}
.theme{all:unset;cursor:pointer;margin-left:auto;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.asof{padding:0 18px;font-size:12px;color:var(--sub)}
.next{margin:12px 18px 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.next b{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px 4px}
.stat{background:var(--soft);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
h2{font-size:16px;font-weight:900;padding:22px 18px 8px;display:flex;align-items:center;gap:8px}
h2 small{font-size:12px;font-weight:500;color:var(--sub)}
h2 .clear{all:unset;cursor:pointer;margin-left:auto;font-size:12px;font-weight:600;color:var(--navy2)}
.chips{display:flex;gap:6px;padding:0 18px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{all:unset;cursor:pointer;flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:20px;font-size:12.5px}
.chips button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:800}
.feed{padding:0 18px}
.day{font-size:12px;font-weight:800;color:var(--sub);padding:12px 0 6px;border-bottom:1px solid var(--line)}
.ev{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ev .emb{margin-top:1px}
.ev .body{flex:1;min-width:0}
.ev .t{font-weight:700;font-size:14px;word-break:keep-all}
.ev .d{font-size:12.5px;color:var(--sub);margin-top:2px;word-break:keep-all}
.ev details{margin-top:4px}
.ev summary{cursor:pointer;font-size:12px;color:var(--navy2);list-style:none}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:' ▾'}
.ev details[open] summary::after{content:' ▴'}
.ev .list{font-size:12.5px;color:var(--fg);margin-top:4px;line-height:1.7}
.tag{flex:none;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:2px}
.c-FA{background:var(--staybg);color:var(--stay)}.c-외국인{background:var(--frbg);color:var(--fr)}.c-트레이드·영입{background:var(--trbg);color:var(--tr)}.c-방출·은퇴{background:var(--outbg);color:var(--out)}
.new{display:inline-block;margin-left:5px;font-size:9px;font-weight:900;color:#fff;background:var(--new);border-radius:2px;padding:1px 4px;vertical-align:2px}
.more{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:calc(100% - 36px);margin:10px 18px 0;padding:10px;text-align:center;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:700;color:var(--navy2)}
.more[hidden]{display:none}
.empty{padding:28px 0;text-align:center;color:var(--sub);font-size:13px}
.emb{width:32px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.emb img{max-width:32px;max-height:24px;width:auto;height:auto;object-fit:contain}
[data-theme=dark] .emb:has(img){background:#fff;border-radius:6px;padding:2px}
.dot{width:12px;height:12px;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px}
.tb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tb .emb{width:44px;height:32px}.tb .emb img{max-width:44px;max-height:32px}
.tb b{font-size:12.5px}
.tb small{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1.35;text-align:center}
.tb small em{font-style:normal;color:var(--in);font-weight:700}.tb small u{text-decoration:none;color:var(--out);font-weight:700}
.tb[aria-pressed=true]{border:2px solid var(--navy2);padding:9px 3px 7px;background:var(--soft)}
.panel{margin:14px 18px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.ph .emb{width:52px;height:38px}.ph .emb img{max-width:52px;max-height:38px}
.ph h3{font-size:18px;font-weight:900}
.ph .sum{font-size:12px;color:var(--sub)}
.ph .copy{all:unset;cursor:pointer;margin-left:auto;font-size:11.5px;font-weight:700;color:var(--navy2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;white-space:nowrap;background:var(--card)}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{font-size:12.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sec h4 .n{font-size:11px;font-weight:700;color:var(--sub)}
.k-in{color:var(--in)}.k-out{color:var(--out)}.k-stay{color:var(--stay)}
.row{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:13.5px;flex-wrap:wrap}
.row .nm{font-weight:800}
.row .sub{font-size:12px;color:var(--sub)}
.none{font-size:12.5px;color:var(--sub)}
.fa{display:flex;flex-wrap:wrap;gap:6px}
.fa span{font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px}
.fa i{font-style:normal;font-size:10px;font-weight:800;margin-left:4px;color:var(--sub)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-height:64px}
.slot .p{font-size:10.5px;color:var(--sub)}
.slot .s{font-size:13px;font-weight:800;word-break:keep-all;line-height:1.3;margin-top:2px}
.slot .x{font-size:10.5px;color:var(--sub);margin-top:2px}
.slot.fresh{border-color:var(--in);background:var(--inbg)}.slot.fresh .s{color:var(--in)}
.slot.tbd .s{color:#b8bccb;font-weight:500}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.rel summary{cursor:pointer;font-size:13px;padding:4px 0}
.rel .list{font-size:12.5px;color:var(--sub);line-height:1.7;padding:2px 0 6px}
.foot{margin-top:26px;padding:14px 18px 30px;font-size:11.5px;color:var(--sub);background:var(--soft);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){
 header,.asof,.feed,.chips,.grid{padding-left:14px;padding-right:14px}
 h2{padding-left:14px;padding-right:14px}
 .next,.panel{margin-left:14px;margin-right:14px}.more{margin-left:14px;margin-right:14px;width:calc(100% - 28px)}.stats{padding-left:14px;padding-right:14px}
 .grid{gap:6px}.tb .emb{width:36px;height:26px}.tb .emb img{max-width:36px;max-height:26px}.tb b{font-size:11.5px}
 .stat b{font-size:17px}
 .slots{grid-template-columns:repeat(2,1fr)}
}

/* dcinside 공식 로고 · 구단 공식 엠블럼 */
.logo{display:inline-flex;align-items:center;color:#3C46A0}
.logo svg{height:16px;width:auto;display:block}
[data-theme=dark] .logo{color:#fff}
.emb{--h:24px}.tb .emb{--h:32px}.ph .emb{--h:38px}
.emb img{height:calc(var(--h)*var(--f,1));width:auto;max-width:none;max-height:none}
@media (max-width:520px){.tb .emb{--h:26px}}

/* ===== dc-sports 공통 헤더 ===== */
.dsh{--dsh-bg:#fff;--dsh-line:#e4e7f0;--dsh-ink:#1a1f36;--dsh-sub:#5b6280;--dsh-soft:#f4f6fb;--dsh-logo:#3C46A0;--dsh-hi:#1f2a6b;--dsh-on-fg:#fff}
[data-theme=dark] .dsh{--dsh-bg:#1a1d25;--dsh-line:#2a2e3a;--dsh-ink:#e8eaf2;--dsh-sub:#9aa1b8;--dsh-soft:#1f222c;--dsh-logo:#fff;--dsh-hi:#8fa0ff;--dsh-on-fg:#12141b}
header.dsh{position:sticky;top:0;z-index:40;margin:0;padding:0;background:var(--dsh-bg);border-bottom:1px solid var(--dsh-line);color:var(--dsh-ink)}
.dsh-bar{height:4px;background:#1f2a6b}
.dsh-in{max-width:1180px;margin:0 auto;padding:0 20px;min-height:60px;display:flex;align-items:center;gap:14px;box-sizing:border-box}
.dsh-logo{display:flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:inherit}
.dsh-logo svg{height:16px;width:auto;display:block;fill:var(--dsh-logo)}
.dsh-badge{background:#3C46A0;color:#fff;font-size:11px;font-weight:800;line-height:1.3;padding:3px 7px;border-radius:4px;letter-spacing:.5px}
.dsh-sep{color:#c5c9d8;font-weight:400}
.dsh-ttl{font-size:15px;font-weight:800;color:var(--dsh-ink);margin:0;padding:0;white-space:nowrap;letter-spacing:-.2px}
.dsh-nav{display:flex;gap:22px;margin-left:auto;font-size:14px;font-weight:700}
.dsh-nav a{color:var(--dsh-ink);text-decoration:none;white-space:nowrap}
.dsh-nav a:hover{color:var(--dsh-hi)}
.dsh-sw{display:flex;gap:2px;flex:none;background:var(--dsh-soft);border:1px solid var(--dsh-line);border-radius:999px;padding:3px}
.dsh-ttl+.dsh-sw{margin-left:auto}
.dsh-nav+.dsh-sw{margin-left:4px}
.dsh-sw a{padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:800;line-height:1.5;color:var(--dsh-sub);white-space:nowrap;text-decoration:none}
.dsh-sw a.on{background:var(--dsh-hi);color:var(--dsh-on-fg)}
.dsh-sw a:hover:not(.on){color:var(--dsh-hi)}
.dsh-sw .s{display:none}
.dsh .dsh-theme{flex:none;margin:0;border:1px solid var(--dsh-line);border-radius:999px;padding:4px 10px;font-size:12px;line-height:1.4;color:var(--dsh-sub);background:transparent;cursor:pointer;white-space:nowrap}
header.dsh .subnav{border-top:1px solid var(--dsh-line);color:var(--dsh-sub)}
header.dsh .subnav a{color:var(--dsh-ink)}
@media (max-width:1120px){.has-nav .dsh-sep,.has-nav .dsh-ttl{display:none}.has-nav .dsh-nav{margin-left:auto}}
@media (max-width:960px){.has-nav .dsh-sw .l{display:none}.has-nav .dsh-sw .s{display:inline}.has-nav .dsh-nav{gap:16px}}
@media (max-width:860px){.dsh-nav{display:none}.has-nav .dsh-sw{margin-left:auto}}
@media (max-width:600px){.dsh-in{padding:0 16px;gap:10px}.dsh-badge{display:none}.dsh-logo svg{height:15px}.dsh-sw .l{display:none}.dsh-sw .s{display:inline}
 .dsh:not(.has-nav) .dsh-in{flex-wrap:wrap;row-gap:0;padding-top:10px;padding-bottom:8px}
 .dsh:not(.has-nav) .dsh-sep{display:none}
 .dsh:not(.has-nav) .dsh-sw{order:2;margin-left:auto}
 .dsh:not(.has-nav) .dsh-ttl{order:3;flex:1;font-size:18px;margin-top:10px}
 .dsh:not(.has-nav) .dsh-theme{order:4;margin-top:10px}}
@media (max-width:380px){.dsh-sw a{padding:4px 9px;font-size:12px}}

header.dsh{display:block;position:static}
</style>

function teamData(t){
 const IN=[],OUT=[],STAY=[];
 DATA.fa.forEach(p=>{const det=(p.detail||'').replace(/\s*\(\d+\/\d+\)/,'');
  if(p.status==='이적'&&p.to===t)IN.push({n:p.name,s:`FA · ${p.team}에서 · ${det}`});
  if(p.status==='이적'&&p.team===t)OUT.push({n:p.name,s:`FA · ${p.to}로 · ${det}`});
  if(p.status==='잔류'&&p.team===t)STAY.push({n:p.name,s:`FA 잔류 · ${det}`});});
 (DATA.moves||[]).forEach(m=>{if(m.to===t)IN.push({n:m.name,s:`${m.type} · ${m.from}에서 · ${m.pos}`});if(m.from===t&&m.type==='트레이드')OUT.push({n:m.name,s:`${m.type} · ${m.to}로 · ${m.pos}`});});
 const r=DATA.roster[t];
 [...r.slots.map(([p,x])=>[p==='투'?'투수':p==='타'?'타자':p,x]),['아시아쿼터',r.aq]].forEach(([p,x])=>{if(!x)return;
  if(x.s==='new')IN.push({n:x.n,s:`외국인 신규 · ${p}${x.d&&x.d!=='신규'?' · '+x.d:''}`});
  else if(x.s==='re')STAY.push({n:x.n,s:`외국인 재계약 · ${p}${x.d?' · '+x.d:''}`});});
 const rel=DATA.extra.releases.filter(x=>x.team===t).map(x=>({...x,players:x.players.map(pl=>{const mv=(DATA.moves||[]).find(m=>m.type!=='트레이드'&&m.from===t&&nm(pl)===m.name);return mv?`${pl} → ${mv.to} 입단`:pl;})}));
 const ret=DATA.extra.retire.filter(x=>x.team===t);
 const neg=DATA.fa.filter(p=>p.team===t&&p.status==='협상중');
 const relN=rel.reduce((a,x)=>a+x.players.length,0);
 return {IN,OUT,STAY,rel,ret,neg,relN,r};
}

/* ---------- 상단 ---------- */
const a=DATA.asof.match(/\d{4}-(\d\d)-(\d\d) (\d\d:\d\d)/);
document.getElementById('asof').textContent=`${+a[1]}월 ${+a[2]}일 ${a[3]} 기준`;
document.getElementById('next').innerHTML='<b>다음 일정</b>'+DATA.extra.upcoming.map(u=>`<span>${esc(u.date)} ${esc(u.text)}</span>`).join('<span>·</span>');
const faDone=DATA.fa.filter(p=>p.status!=='협상중').length;
const relAll=DATA.extra.releases.reduce((s,x)=>s+x.players.length,0);
document.getElementById('stats').innerHTML=[[`${faDone}/${DATA.fa.length}`,'FA 계약'],[(DATA.moves||[]).filter(m=>m.type==='트레이드').length/2+'건','트레이드'],[(DATA.moves||[]).filter(m=>m.type!=='트레이드').length+'명','방출 선수 영입'],[relAll+'명','방출']].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

/* ---------- 상태 ---------- */
let cat='전체',team=null,limit=12;
try{const q=new URLSearchParams(location.search).get('team');if(q){const k=TEAMS.find(x=>x.toLowerCase()===q.toLowerCase());if(k)team=k;}}catch(e){}

function renderFeed(){
 document.getElementById('feedTitle').innerHTML=team?`${esc(team)} 소식 <button class="clear" id="clr" type="button">전체 소식 보기</button>`:'최근 소식';
 if(team)document.getElementById('clr').onclick=()=>selectTeam(null);
 document.getElementById('cats').innerHTML=['전체',...CATS].map(c=>`<button type="button" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('');
 const rows=EV.filter(e=>(cat==='전체'||e.cat===cat)&&(!team||e.teams.includes(team)));
 const shown=rows.slice(0,limit);let html='',last='';
 shown.forEach(e=>{if(e.date!==last){html+=`<div class="day">${dayLabel(e.date)}</div>`;last=e.date;}
  html+=`<div class="ev">${emb(e.team)}<div class="body"><div class="t">${esc(e.t)}${isNew(e.date)?'<span class="new">NEW</span>':''}</div>${e.d?`<div class="d">${esc(e.d)}</div>`:''}${e.list?`<details><summary>전체 명단</summary><div class="list">${e.list.map(esc).join(', ')}</div></details>`:''}</div><span class="tag c-${e.cat}">${e.cat}</span></div>`;});
 document.getElementById('feed').innerHTML=html||'<p class="empty">해당하는 공식 발표가 아직 없어요</p>';
 const more=document.getElementById('more');more.hidden=rows.length<=limit;more.textContent=`이전 소식 더 보기 (${rows.length-limit}건)`;
}
function list(arr,emptyMsg){return arr.length?arr.map(x=>`<div class="row"><span class="nm">${esc(x.n)}</span><span class="sub">${esc(x.s)}</span></div>`).join(''):`<p class="none">${emptyMsg}</p>`;}
function renderGrid(){
 document.getElementById('grid').innerHTML=TEAMS.map(t=>{const d=teamData(t);
  return `<button class="tb" type="button" data-t="${t}" aria-pressed="${t===team}">${emb(t)}<b>${t}</b><small>영입 <em>${d.IN.length}</em><br>이탈 <u>${d.OUT.length+d.relN}</u></small></button>`;}).join('');
}
function renderPanel(){
 const el=document.getElementById('panel');if(!team){el.innerHTML='';return;}
 const d=teamData(team);
 const slot=(p,x)=>!x?`<div class="slot tbd"><div class="p">${p}</div><div class="s">미정</div></div>`:`<div class="slot ${x.s==='new'?'fresh':''}"><div class="p">${p}</div><div class="s">${esc(x.n)}</div><div class="x">${x.s==='new'?'신규':'재계약'}${x.d&&x.d!=='신규'?' · '+esc(x.d):''}</div></div>`;
 el.innerHTML=`<div class="panel">
 <div class="ph">${emb(team)}<div><h3>${FULL[team]}</h3><div class="sum">영입 ${d.IN.length} · 이탈 ${d.OUT.length} · 방출 ${d.relN} · FA 협상 중 ${d.neg.length}</div></div><button class="copy" id="copy" type="button">팀 링크 복사</button></div>
 <div class="sec"><h4 class="k-in">▲ 영입 <span class="n">${d.IN.length}</span></h4>${list(d.IN,'아직 공식 발표된 영입이 없어요')}</div>
 <div class="sec"><h4 class="k-out">▼ 이탈 <span class="n">${d.OUT.length}</span></h4>${list(d.OUT,'FA·트레이드로 떠난 선수는 아직 없어요')}</div>
 <div class="sec"><h4 class="k-stay">● 잔류·재계약 <span class="n">${d.STAY.length}</span></h4>${list(d.STAY,'아직 공식 발표된 잔류·재계약이 없어요')}</div>
 <div class="sec"><h4>FA 협상 중 <span class="n">${d.neg.length}</span></h4>${d.neg.length?`<div class="fa">${d.neg.map(p=>`<span>${esc(p.name)}<i>${p.grade}</i></span>`).join('')}</div>`:'<p class="none">협상 중인 내부 FA가 없어요</p>'}</div>
 <div class="sec"><h4>외국인·아시아쿼터</h4><div class="slots">${d.r.slots.map(([p,x])=>slot(p==='투'?'외국인 투수':p==='타'?'외국인 타자':'외국인',x)).join('')}${slot('아시아쿼터',d.r.aq)}</div>${d.r.note?`<p class="note">${esc(d.r.note)}</p>`:''}</div>
 <div class="sec"><h4 class="k-out">방출·은퇴 <span class="n">${d.relN}</span></h4>${d.rel.length?d.rel.map(r=>`<details class="rel"><summary>${esc(r.date)} 재계약 불가 ${r.players.length}명</summary><div class="list">${r.players.map(esc).join(', ')}${r.note?` · ${esc(r.note)}`:''}</div></details>`).join(''):'<p class="none">시즌 종료 후 방출 발표가 없어요</p>'}${d.ret.map(r=>`<div class="row"><span class="nm">${esc(r.name)} 은퇴</span><span class="sub">${esc(r.date)} · ${esc(r.detail)}</span></div>`).join('')}</div>
 </div>`;
 document.getElementById('copy').onclick=()=>{const u=location.href.split(/[?#]/)[0]+'?team='+encodeURIComponent(team);
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('팀 링크를 복사했어요')).catch(()=>toast(u));};
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function selectTeam(t,scroll){team=t===team?null:t;limit=12;
 try{const u=new URL(location.href);team?u.searchParams.set('team',team):u.searchParams.delete('team');history.replaceState(null,'',u);}catch(e){}
 renderFeed();renderGrid();renderPanel();
 if(team&&scroll)document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});}
document.getElementById('cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;limit=12;renderFeed();};
document.getElementById('more').onclick=()=>{limit+=20;renderFeed();};
document.getElementById('grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;selectTeam(b.dataset.t,true);};
const th=document.getElementById('theme');
const setTh=()=>th.textContent=document.documentElement.dataset.theme==='dark'?'라이트 모드':'다크 모드';
th.onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'':'dark';setTh();};setTh();
renderFeed();renderGrid();renderPanel();
</script>
</body>
</html>
